<div id="topDiv">
  <div class="stat-group">
    <div class="stat-header">
      <span class="stat-label">HP</span>
      <span class="stat-values">{{topDivDto()?.currentHp}}/{{topDivDto()?.maxHp}}</span>
    </div>
    <app-stat-bar [current]="topDivDto()?.currentHp ?? 0" [max]="topDivDto()?.maxHp ?? 0" type="hp"></app-stat-bar>
  </div>

  <div class="stat-group">
    <div class="stat-header">
      <span class="stat-label">Energy</span>
      <span class="stat-values">{{topDivDto()?.currEnergy}}/{{topDivDto()?.maxEnergy}}</span>
    </div>
    <app-stat-bar [current]="topDivDto()?.currEnergy ?? 0" [max]="topDivDto()?.maxEnergy ?? 0" type="energy"></app-stat-bar>
  </div>

  <div class="stat-group">
    <div class="stat-header">
      <span class="stat-label">Experience</span>
      <span class="stat-values">{{topDivDto()?.currentExp}}/{{topDivDto()?.nxtLvlExp}}</span>
    </div>
    <app-stat-bar [current]="topDivDto()?.currentExp ?? 0" [max]="topDivDto()?.nxtLvlExp ?? 0" type="exp"></app-stat-bar>
  </div>
</div>
<div class="main-area">
<nav class="side-menu">
  <a routerLink="/menu" routerLinkActive="active">Home</a>
  <a routerLink="/training" routerLinkActive="active">Training</a>
</nav>


<router-outlet></router-outlet>
</div>
