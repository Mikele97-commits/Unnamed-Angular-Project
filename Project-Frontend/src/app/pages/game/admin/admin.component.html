<form #energyForm="ngForm" (ngSubmit)="setEnergy(energyForm)">
  <div>
    <label for="username">Username</label>
    <input type="text" id="energyUsername" name="energyUsername" [(ngModel)]="energyUsername" required>
  </div>

  <div>
    <label for="amount">Energy amount</label>
    <input type="number" id="energyAmount" name="energyAmount" [(ngModel)]="energyAmount" required>
  </div>

  <button type="submit">Set Energy</button>
</form>

  <div>

<form #addItemForm="ngForm" (ngSubmit)="giveItem(addItemForm)">

    <label for="username">Username</label>
    <input type="text" id="giveItemUsername" name="giveItemUsername" [(ngModel)]="giveItemUsername" required>
  </div>

  <div>
    <label for="amount">Item ID</label>
    <input type="number" id="giveItemId" name="giveItemId" [(ngModel)]="giveItemId" required>
  </div>

  <button type="submit">Give Item</button>
</form>
